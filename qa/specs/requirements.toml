# What "correct" means for jamfinder, written down once, with an ID, a source and how it is verified.
# `python -m qa.specs.trace` runs every linked test and check and writes qa/specs/TRACEABILITY.md.
#
#   method          test (run it), analysis (a static check of the code), inspection (a person reads it)
#   implemented_by  "file:function" - used by the just-in-time tests to rate a change (qa/jit)
#   verified_by     test ids, or "gate:<check>" for a check of qa/harness/gate.py
#   status          accepted (the project's requirement) or proposed (raised by QA, waiting for the owner)

# ---- the reporting rule (rule v3.2, jf/rules.py) ----------------------------------------------------------------

[[requirement]]
id = "REQ-GATE-001"
text = "Report a location only if the spectrum-flip control search reports nothing."
source = "jf/rules.py, condition (a')"
method = "test"
status = "accepted"
implemented_by = ["jf/rules.py:evaluate"]
verified_by = ["tests/test_rules.py::test_flip_null_not_nothing_vetoes_v31",
               "tests/test_rules.py::test_missing_flip_null_blocks_v31_only",
               "qa/properties/test_gate_properties.py::test_the_verdict_is_exactly_its_written_conditions"]

[[requirement]]
id = "REQ-GATE-002"
text = "Report only if the best score is at least NULL_RATIO times the largest non-degenerate control score, the blanking residual is below that control score, and the runner-up is below 0.75 times the best."
source = "jf/rules.py, conditions (b), (c), (d)"
method = "test"
status = "accepted"
implemented_by = ["jf/rules.py:evaluate"]
verified_by = ["tests/test_rules.py::test_b_c_d_boundaries",
               "qa/properties/test_gate_properties.py::test_the_verdict_is_exactly_its_written_conditions",
               "qa/mutation/generated/test_rules_killers.py"]

[[requirement]]
id = "REQ-GATE-003"
text = "A control search that kept less than half of the aircraft time is degenerate and takes no part in the decision."
source = "jf/rules.py, docstring"
method = "test"
status = "accepted"
implemented_by = ["jf/rules.py:is_degenerate", "jf/rules.py:evaluate"]
verified_by = ["tests/test_rules.py::test_degenerate_nulls_take_no_part",
               "qa/properties/test_gate_properties.py::test_a_degenerate_control_has_no_say"]

[[requirement]]
id = "REQ-GATE-004"
text = "The verdict does not depend on the unit of the scores or on the order of the control searches."
source = "follows from REQ-GATE-001 and -002: every condition is a ratio or a label"
method = "test"
status = "accepted"
implemented_by = ["jf/rules.py:evaluate"]
verified_by = ["qa/properties/test_gate_properties.py::test_the_unit_of_the_scores_does_not_matter",
               "qa/properties/test_gate_properties.py::test_the_order_of_the_control_searches_does_not_matter",
               "qa/properties/test_gate_properties.py::test_a_stronger_best_spot_never_lowers_confidence"]

[[requirement]]
id = "REQ-GATE-005"
text = "More evidence of false spots (a louder control search) never makes the rule more willing to report."
source = "proposed by QA after FINDING-001 (qa/properties/README.md); the rule's owner decides"
method = "test"
status = "proposed"
implemented_by = ["jf/rules.py:evaluate"]
verified_by = ["qa/properties/test_gate_properties.py::test_more_evidence_against_never_raises_confidence"]

