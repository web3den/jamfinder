# The verification framework in qa/, run on every push and pull request. No secrets are used: the model-driven
# parts replay recorded answers (qa/cassettes), so CI needs no key and makes no model calls.
name: qa

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"            # Hypothesis uses a fixed seed: a red build is always reproducible
  QA_LLM: replay     # a model call without a recorded answer is an error, never a live call

jobs:
  gate:
    name: governance gate (keys, skips, protected tests, imports, test count)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - run: pip install -r requirements.txt -r qa/requirements.txt
      - run: python -m qa.harness.gate

  tests:
    name: all tests, with design-by-contract checks on every call
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - run: pip install -r requirements.txt -r qa/requirements.txt
      - run: python -m pytest -q -p qa.specs.contracts tests qa

  traceability:
    name: requirements traced to passing tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - run: pip install -r requirements.txt -r qa/requirements.txt
      - run: python -m qa.specs.trace
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: traceability, path: qa/specs/TRACEABILITY.md}

  mutation:
    name: mutation score of the reporting rule, in a container without network
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f qa/Dockerfile -t jamfinder-qa .
      - run: docker run --rm --network none jamfinder-qa

  reproduce:
    name: model-driven results reproduce from the recorded answers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - run: pip install -r requirements.txt -r qa/requirements.txt
      - run: |
          python -m qa.oracle.run
          python -m qa.differential.nversion
          python -m qa.specs.spec_review
          python -m qa.jit.run --demo
          python -m qa.mutation.guided jf/rules.py tests/test_rules.py
      - name: the regenerated reports equal the committed ones
        run: git diff --exit-code -- qa

  evals:
    name: agent evals, replayed (on request)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements.txt"}
      - run: pip install -r requirements.txt -r qa/requirements.txt
      - run: python -m qa.evals.run
      - run: git diff --exit-code -- qa/evals/RESULT.md
